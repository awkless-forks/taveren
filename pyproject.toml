[project]
name = "taveren"
version = "0.1.0"
description = "Find blind-trust vulnerabilities in PLC binaries via state machine recovery"
requires-python = ">=3.12,<3.13"
dependencies = [
    # NOTE: claripy ships inside angr (as angr.claripy) since angr 10. The
    # patches our former angr/claripy forks carried live in
    # src/taveren/angr_compat.py.
    "angr[unicorn]>=10.0.1,<11",
    "networkx",
    "pygraphviz",
]

[project.scripts]
taveren-scan-cycle = "taveren.scan_cycle:main"
taveren-init-finder = "taveren.init_finder:main"
taveren-statevars = "taveren.statevars:main"

[project.optional-dependencies]
test = ["pytest"]
gui = ["angr-management>=10.0.1,<11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taveren"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
